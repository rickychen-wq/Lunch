<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理員</title>
<meta name="theme-color" content="#0B0A06">
<link rel="manifest" href="./manifest-admin.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="管理員">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A06; --card:#15120A; --card-2:#1D190F; --line:#2B2416; --line-2:#3E351F;
  --gold:#E8B33C; --gold-2:#FFD36E; --gold-dim:#7E6A38;
  --text:#F4EFE3; --muted:#8E8674; --sage:#7FB36B; --rust:#C85F3C;
  --ease:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;
  padding-bottom:max(48px,env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(232,179,60,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(232,179,60,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(120% 70% at 50% 0%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(120% 70% at 50% 0%,#000 0%,transparent 72%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#root,#sheet,#toast{position:relative;z-index:2}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700}
.hide{display:none!important}
.brk{position:relative}
.brk::before,.brk::after{content:"";position:absolute;width:11px;height:11px;pointer-events:none;
  border-color:var(--gold-dim);border-style:solid;opacity:.9}
.brk::before{top:-1px;left:-1px;border-width:1.5px 0 0 1.5px}
.brk::after{bottom:-1px;right:-1px;border-width:0 1.5px 1.5px 0}

header{position:sticky;top:0;z-index:30;background:rgba(11,10,6,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
header .scan{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;background-size:50% 100%;background-repeat:no-repeat;animation:slide 5s linear infinite}
@keyframes slide{0%{background-position:-60% 0}100%{background-position:160% 0}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0 10px}
.ttl{font-size:13px;font-weight:800;font-family:"JetBrains Mono",monospace;letter-spacing:.2em;color:var(--gold)}
.ttl small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.1em;margin-top:2px}
.link{background:var(--card);border:1px solid var(--line-2);color:var(--muted);
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;padding:8px 12px;
  cursor:pointer;flex:none;transition:.2s var(--ease)}
.link.on{border-color:var(--gold);color:var(--gold);background:var(--card-2)}

.tabs{display:flex;gap:7px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:1 0 auto;min-width:56px;background:var(--card);border:1px solid var(--line-2);
  padding:9px 6px 8px;color:var(--muted);font-family:inherit;cursor:pointer;text-align:center;line-height:1.2;
  transition:transform .16s var(--ease),background-color .22s,border-color .22s,box-shadow .28s}
.tab:active{transform:scale(.94)}
.tab .w{font-size:15px;font-weight:700;color:var(--text)}
.tab .d{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px}
.tab.half{border-color:var(--gold-dim)}
.tab.half .d{color:var(--gold-dim)}
.tab.done{border-color:var(--gold);box-shadow:0 0 20px -6px rgba(232,179,60,.6)}
.tab.done .d{color:var(--gold)}
.tab.done::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
  background:var(--gold);box-shadow:0 0 7px var(--gold)}
.tab.sel{background:var(--gold);border-color:var(--gold-2);box-shadow:0 0 26px -8px rgba(232,179,60,.85)}
.tab.sel .w,.tab.sel .d{color:#1B1405}
.tab.sel::after{background:#1B1405;box-shadow:none}
.tab.today .w::before{content:"";display:inline-block;width:5px;height:5px;background:var(--gold);
  margin-right:5px;vertical-align:middle}
.tab.sel.today .w::before{background:#1B1405}

main{animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
section{margin:26px 0}
.shead{display:flex;align-items:center;gap:11px;margin:0 0 12px}
.shead h2{font-size:12px;font-weight:800;margin:0;flex:none;font-family:"JetBrains Mono",monospace;
  letter-spacing:.18em;color:var(--gold)}
.shead .rule{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line-2) 0 4px,transparent 4px 8px)}
.shead .cnt{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;color:var(--muted);
  flex:none;letter-spacing:.06em}
.dayttl{font-size:22px;font-weight:700;margin:20px 0 0;letter-spacing:-.01em}
.dayttl .tag{font-size:11px;font-weight:800;color:#1B1405;background:var(--gold);padding:2px 9px;
  margin-left:9px;vertical-align:3px;font-family:"JetBrains Mono",monospace;letter-spacing:.08em}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.slot{border:1.5px dashed var(--line-2);background:var(--card);aspect-ratio:3/4;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--muted);
  font-size:14px;cursor:pointer;position:relative;overflow:hidden;text-align:center;padding:8px;
  transition:border-color .22s,transform .16s var(--ease)}
.slot:active{transform:scale(.975)}
.slot.filled{border-style:solid;border-color:var(--gold-dim)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .tag{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 8px;font-size:11.5px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.92));z-index:2;text-align:left;
  font-family:"JetBrains Mono",monospace;letter-spacing:.06em}
.slot .plus{font-size:26px;color:var(--gold-dim);line-height:1}
.slot input{display:none}
.slot.busy::before{content:"";position:absolute;inset:0;background:rgba(11,10,6,.78);z-index:3}
.slot.busy::after{content:"上傳中…";position:absolute;inset:0;z-index:4;display:flex;align-items:center;
  justify-content:center;color:var(--gold);font-size:13px;font-weight:700;
  font-family:"JetBrains Mono",monospace;letter-spacing:.1em}

.state{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--sage);padding:13px 15px;margin-top:14px}
.state .ico{width:9px;height:9px;flex:none;background:var(--sage);box-shadow:0 0 10px var(--sage);
  animation:blip 1.9s var(--ease) infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.state.wait{border-left-color:var(--gold)}
.state.wait .ico{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.state.shut{border-left-color:var(--rust)}
.state.shut .ico{background:var(--rust);box-shadow:none;animation:none}
.state .t{flex:1;font-size:15px;font-weight:700;line-height:1.35}
.state .t small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;
  font-family:"JetBrains Mono",monospace;letter-spacing:.02em}

.btn{background:var(--card-2);border:1px solid var(--gold-dim);color:var(--gold);padding:10px 15px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex:none;
  transition:transform .15s var(--ease),background-color .2s,border-color .2s,color .2s}
.btn.solid{background:var(--gold);color:#1B1405;border-color:var(--gold-2)}
.btn.ghost{border-color:var(--line-2);color:var(--muted)}
.btn.danger{border-color:var(--rust);color:var(--rust)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%;padding:14px;font-size:16px;margin-top:11px}
.btn.done{background:transparent;border-color:var(--sage);color:var(--sage)}

.tally{border:1px solid var(--line);background:var(--card)}
.row{display:flex;align-items:center;gap:13px;padding:10px 15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .code{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:15px;width:78px;flex:none;
  color:var(--gold);letter-spacing:.02em}
.row .code i{font-style:normal;font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:.04em}
.row .track{flex:1;height:8px;background:var(--card-2);overflow:hidden;min-width:0}
.row .fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0;
  transition:width .55s var(--ease);box-shadow:0 0 10px -2px var(--gold)}
.row .n{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:21px;width:30px;text-align:right;flex:none}
.row.zero{opacity:.24}
.row.total{background:var(--card-2)}
.row.total .code{width:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);
  letter-spacing:.16em;font-weight:700}
.row.total .n{color:var(--gold)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.p{background:var(--card);border:1px solid var(--line-2);padding:10px 11px;text-align:left;
  cursor:pointer;color:var(--text);font-family:inherit;transition:transform .15s var(--ease),
  border-color .2s,opacity .3s;animation:rise .34s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.p:active{transform:scale(.94)}
.p .s{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:17px;display:flex;
  align-items:center;justify-content:space-between}
.p .o{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;color:var(--gold);letter-spacing:.03em}
.p.paid{opacity:.48}
.p.paid .o{color:var(--sage)}
.p.paid .s::after{content:"✓";color:var(--sage);font-size:14px}
.p.ro{cursor:default}.p.ro:active{transform:none}
.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.miss button{background:var(--card);border:1px dashed var(--line-2);color:var(--muted);
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;padding:11px 0;cursor:pointer;
  transition:transform .14s var(--ease),border-color .2s,color .2s}
.miss button:active{transform:scale(.9)}
.empty{color:var(--muted);font-size:14px;padding:12px 2px}

.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.setrow label{flex:1 1 auto;color:var(--muted);min-width:0}
.setrow input{flex:0 0 auto;width:132px;max-width:42vw;min-width:0;-webkit-appearance:none;appearance:none;
  background:var(--card);border:1px solid var(--line-2);color:var(--text);padding:11px 8px;
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;text-align:center;line-height:1.2}
.setrow input::-webkit-date-and-time-value{text-align:center;margin:0}
.setrow input::-webkit-calendar-picker-indicator{margin:0;padding:0;opacity:.5}
.setrow input:focus{outline:none;border-color:var(--gold)}
.hint{color:var(--muted);font-size:13px;margin:15px 0 0;line-height:1.75}

.gate{max-width:320px;margin:14vh auto 0;padding:0 16px;text-align:center;animation:fade .35s var(--ease)}
.gate h1{font-size:14px;margin:0 0 8px;font-family:"JetBrains Mono",monospace;letter-spacing:.24em;color:var(--gold)}
.gate p{color:var(--muted);font-size:14px;margin:0 0 22px}
.gate input{width:100%;background:var(--card);border:1px solid var(--line-2);color:var(--text);
  padding:17px;font-size:27px;text-align:center;letter-spacing:.5em;font-family:"JetBrains Mono",monospace;
  font-weight:800;-webkit-appearance:none;appearance:none}
.gate input:focus{outline:none;border-color:var(--gold)}
.gate .err{color:var(--rust);font-size:13px;height:20px;margin-top:11px;
  font-family:"JetBrains Mono",monospace;letter-spacing:.04em}

#sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(6,5,3,.72);backdrop-filter:blur(3px)}
#sheet.on{display:flex;animation:fade .2s var(--ease)}
#sheet .box{background:var(--card);border:1px solid var(--line-2);border-bottom:none;width:100%;
  max-width:560px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
  animation:up .3s var(--ease);max-height:88vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheet h3{margin:0 0 4px;font-size:19px}
#sheet .who{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--gold);margin:0 0 14px}
#sheet p.d{margin:0 0 18px;color:var(--muted);font-size:14px}
#sheet .acts{display:flex;flex-direction:column;gap:9px}
#sheet .acts .btn{width:100%;padding:14px;font-size:15.5px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.pgrid.b3{grid-template-columns:repeat(3,1fr)}
.pk{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:18px;height:52px;
  background:var(--card-2);border:1px solid var(--line-2);color:var(--text);cursor:pointer;
  transition:transform .14s var(--ease),background-color .2s,color .2s,box-shadow .22s}
.pk:active{transform:scale(.93)}
.pk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold-2);color:#1B1405;
  box-shadow:0 0 22px -8px rgba(232,179,60,.85)}
.vlbl{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--gold);margin:14px 0 9px}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px) scale(.96);background:var(--gold);
  color:#1B1405;font-weight:700;font-size:14px;padding:9px 19px;opacity:0;pointer-events:none;z-index:90;
  font-family:"JetBrains Mono",monospace;letter-spacing:.04em;
  transition:opacity .2s var(--ease),transform .2s var(--ease);box-shadow:0 10px 30px -10px #000}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.bad{background:var(--rust);color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"><div class="wrap"><p style="padding:44px 0;color:#8E8674">載入中…</p></div></div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAd7VtfhNW_DgwPrXaYfY_Nz_WLPoWSFvA",
  authDomain: "lunch-77823.firebaseapp.com",
  projectId: "lunch-77823",
  storageBucket: "lunch-77823.firebasestorage.app",
  messagingSenderId: "178487710705",
  appId: "1:178487710705:web:8d8f26f742e8c56e506a50",
  measurementId: "G-PM5VHQ6TTQ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const BENTO = ["A1","A2","A3","A4","A5","A6","A7","A8"];
const SETS  = ["B1","B2","B3"];
const VNAME = { set:"套餐", single:"非套餐" };
const D = { seatCount:35, openTime:"06:00", closeTime:"08:10" };
const WD = ["一","二","三","四","五"];
const $ = id => document.getElementById(id);

const ROWS = [
  ...BENTO.map(c=>({ k:c, code:c, sub:"" })),
  ...SETS.flatMap(c=>[{ k:c+"|set", code:c, sub:"套餐" },{ k:c+"|single", code:c, sub:"非套餐" }])
];
const rowKey = o => !o.item ? null
  : o.item.startsWith("B") ? o.item + "|" + (o.variant || "single") : o.item;
const label = o => !o.item ? "—" : o.item + (o.variant ? " " + VNAME[o.variant] : "");

function twNow(){ const n=new Date(); return new Date(n.getTime()+n.getTimezoneOffset()*60000+8*3600000); }
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function shift(k,n){ const [y,m,d]=k.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d));
  t.setUTCDate(t.getUTCDate()+n);
  return t.getUTCFullYear()+"-"+String(t.getUTCMonth()+1).padStart(2,"0")+"-"+String(t.getUTCDate()).padStart(2,"0"); }
function md(k){ const [,m,d]=k.split("-").map(Number); return m+"/"+d; }
function pretty(k){ const [y,m,d]=k.split("-").map(Number);
  return `${m}/${d} 星期`+["日","一","二","三","四","五","六"][new Date(Date.UTC(y,m-1,d)).getUTCDay()]; }
function mins(s){ const [h,m]=String(s).split(":").map(Number); return h*60+m; }
function nowMins(){ const t=twNow(); return t.getHours()*60+t.getMinutes(); }
function todayKey(){ return keyOf(twNow()); }
function weekKeys(){
  const t = twNow(), dow = t.getDay();
  t.setDate(t.getDate() + (dow===0 ? 1 : dow===6 ? 2 : 1-dow));
  const mon = keyOf(t);
  return [0,1,2,3,4].map(i=>shift(mon,i));
}

let settings = Object.assign({}, D), settingsLoaded = false;
let unlocked = sessionStorage.getItem("lunch_admin") === "1";
let week = weekKeys(), view = "day", sel = 0;
let dayDocs = {}, orders = [], photos = { bento:null, set:null }, busy = {};
let hist = { key: todayKey(), orders:null, loading:false };
let unsubWeek=null, unsubOrders=null, unsubMedia=null;
let shellUp = false, sigTabs = "", sigMain = "";
let edit = null;   // { seat, item, variant }
const root = $("root");

(function(){ const i = week.indexOf(todayKey()); sel = i>=0 ? i : 0; })();
const selKey = ()=> week[sel];

function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
let toastTimer;
function toast(t, bad){
  const el = $("toast"); el.textContent = t; el.classList.toggle("bad", !!bad); el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("on"), 1700);
}
function closeSheet(){ $("sheet").classList.remove("on"); edit = null; }
$("sheet").onclick = e=>{ if(e.target.id === "sheet") closeSheet(); };

/* ---------- PIN ---------- */
function renderGate(setup){
  shellUp = false; sigTabs = ""; sigMain = "";
  root.innerHTML = `<div class="gate">
    <h1>${setup?"SET PASSCODE":"ADMIN"}</h1>
    <p>${setup?"設一組 4 位數密碼，之後進後台都用這組。":"輸入密碼進入後台。"}</p>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="····">
    <div class="err" id="pinErr"></div>
    <button class="btn solid wide" id="pinGo">${setup?"設定並進入":"進入"}</button></div>`;
  const pin = $("pin"); setTimeout(()=>pin.focus(), 80);
  const go = async ()=>{
    const v = pin.value.trim();
    if(!/^\d{4}$/.test(v)){ $("pinErr").textContent = "要 4 位數字"; return; }
    if(setup){
      try{ await db.collection("config").doc("settings").set({ adminPin:v }, { merge:true }); settings.adminPin = v; }
      catch(e){ console.error(e); $("pinErr").textContent = "存不進去，檢查規則"; return; }
    } else if(v !== settings.adminPin){
      $("pinErr").textContent = "密碼不對"; pin.value = ""; buzz(60); return;
    }
    unlocked = true; sessionStorage.setItem("lunch_admin","1");
    watchWeek(); watchSel(); render();
  };
  $("pinGo").onclick = go;
  pin.onkeydown = e=>{ if(e.key === "Enter") go(); };
}

/* ---------- 照片 ---------- */
async function compress(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:"from-image" }); }
  catch(e){ bmp = await createImageBitmap(file); }
  const scale = Math.min(1, 1100 / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  let q = 0.62, out = c.toDataURL("image/jpeg", q);
  while(out.length > 720000 && q > 0.28){ q -= 0.08; out = c.toDataURL("image/jpeg", q); }
  return out;
}
async function upload(kind, file){
  const key = selKey();
  busy[kind] = true; sigMain = ""; render();
  try{
    const data = await compress(file);
    await db.collection("days").doc(key).collection("media").doc(kind).set({
      data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    const shot = Object.assign({}, (dayDocs[key] && dayDocs[key].shot) || {}, { [kind]:true });
    await db.collection("days").doc(key).set({
      shot, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
    buzz(14); toast("上傳完成");
  }catch(e){ console.error(e); toast("上傳失敗，再試一次", true); }
  busy[kind] = false; sigMain = ""; render();
}
async function setForce(v){
  try{
    await db.collection("days").doc(selKey()).set({ forceOpen:v }, { merge:true });
    buzz(12); toast(v===true ? "已手動開啟" : v===false ? "已關閉" : "恢復自動");
  }catch(e){ console.error(e); toast("改不動，檢查網路", true); }
}

/* ---------- 面板 ---------- */
function openPerson(o){
  edit = null;
  const box = $("sheetBox");
  if(o.paid){
    box.innerHTML = `<div class="who">SEAT ${o.seat}</div><h3>${label(o)}</h3>
      <p class="d">這單已經收錢了，不能再改。要改的話先點回「還沒付」。</p>
      <div class="acts">
        <button class="btn" id="unpay">改回還沒付</button>
        <button class="btn ghost" id="cancel">關閉</button></div>`;
    $("unpay").onclick = ()=>setPaid(o, false);
  } else {
    box.innerHTML = `<div class="who">SEAT ${o.seat}</div><h3>${label(o)}</h3>
      <p class="d">要幫他改單，還是登記收到錢？</p>
      <div class="acts">
        <button class="btn solid" id="pay">收到錢了</button>
        <button class="btn" id="chg">改這一單</button>
        <button class="btn danger" id="del">取消訂單</button>
        <button class="btn ghost" id="cancel">關閉</button></div>`;
    $("pay").onclick = ()=>setPaid(o, true);
    $("chg").onclick = ()=>openPicker(o.seat, { item:o.item, variant:o.variant });
    $("del").onclick = ()=>clearOrder(o.seat);
  }
  $("cancel").onclick = closeSheet;
  $("sheet").classList.add("on");
}

function openPicker(seat, cur){
  edit = { seat, item: cur ? cur.item : null, variant: cur ? cur.variant : null };
  drawPicker();
  $("sheet").classList.add("on");
}
function drawPicker(){
  const box = $("sheetBox");
  const need = edit.item && edit.item.startsWith("B") && !edit.variant;
  box.innerHTML = `<div class="who">SEAT ${edit.seat}</div><h3>選餐點</h3>
    <p class="d">一個人只能一個。選 B 系列要再選套餐或非套餐。</p>
    <div class="vlbl">便當</div>
    <div class="pgrid">${BENTO.map(c=>
      `<button class="pk" data-i="${c}" aria-pressed="${edit.item===c}">${c}</button>`).join("")}</div>
    <div class="vlbl">套餐區</div>
    <div class="pgrid b3">${SETS.map(c=>
      `<button class="pk" data-i="${c}" aria-pressed="${edit.item===c}">${c}</button>`).join("")}</div>
    ${edit.item && edit.item.startsWith("B") ? `
      <div class="vlbl">${edit.item} 要哪種</div>
      <div class="pgrid b3" style="grid-template-columns:1fr 1fr">
        <button class="pk" data-v="set" aria-pressed="${edit.variant==="set"}" style="font-family:inherit;font-size:15px">套餐</button>
        <button class="pk" data-v="single" aria-pressed="${edit.variant==="single"}" style="font-family:inherit;font-size:15px">非套餐</button>
      </div>` : ""}
    <div class="acts" style="margin-top:6px">
      <button class="btn solid" id="save" ${(!edit.item||need)?"disabled":""}>${need?"還要選套餐或非套餐":"儲存"}</button>
      <button class="btn ghost" id="cancel">取消</button></div>`;
  box.querySelectorAll("[data-i]").forEach(b=>{
    b.onclick = ()=>{ const c = b.dataset.i;
      if(edit.item === c){ edit.item = null; edit.variant = null; }
      else { edit.item = c; if(!c.startsWith("B")) edit.variant = null; }
      buzz(10); drawPicker(); };
  });
  box.querySelectorAll("[data-v]").forEach(b=>{
    b.onclick = ()=>{ edit.variant = (edit.variant === b.dataset.v) ? null : b.dataset.v; buzz(10); drawPicker(); };
  });
  $("save").onclick = saveEdit;
  $("cancel").onclick = closeSheet;
}

async function saveEdit(){
  if(!edit || !edit.item) return;
  if(edit.item.startsWith("B") && !edit.variant){ toast("還要選套餐或非套餐", true); return; }
  try{
    await db.collection("days").doc(selKey()).collection("orders").doc(String(edit.seat)).set({
      seat: Number(edit.seat), item: edit.item, variant: edit.variant || null, submitted: true,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
    buzz(14); toast("已更新"); closeSheet();
  }catch(e){ console.error(e); toast("存不進去", true); }
}
async function clearOrder(seat){
  try{
    await db.collection("days").doc(selKey()).collection("orders").doc(String(seat)).set({
      seat: Number(seat), item:null, variant:null, submitted:false, paid:false, paidAt:null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
    buzz(14); toast("已取消這一單"); closeSheet();
  }catch(e){ console.error(e); toast("改不動", true); }
}
async function setPaid(o, v){
  try{
    await db.collection("days").doc(selKey()).collection("orders").doc(String(o.seat)).set({
      paid: v, paidAt: v ? firebase.firestore.FieldValue.serverTimestamp() : null }, { merge:true });
    buzz(14); toast(v ? "已收錢" : "改回還沒付"); closeSheet();
  }catch(e){ console.error(e); toast("存不進去", true); }
}

/* ---------- 統計 ---------- */
function tallyOf(list){
  const t = {}; ROWS.forEach(r=>t[r.k] = 0);
  list.forEach(o=>{ const k = rowKey(o); if(k && t[k] !== undefined) t[k]++; });
  return t;
}
function tallyHTML(list){
  const t = tallyOf(list);
  const total = Object.values(t).reduce((a,b)=>a+b,0);
  const max = Math.max(1, ...Object.values(t));
  return `<div class="tally brk">` + ROWS.map(r=>{
    const n = t[r.k];
    return `<div class="row ${n?"":"zero"}"><div class="code">${r.code}${r.sub?`<i>${r.sub}</i>`:""}</div>
      <div class="track"><div class="fill" data-w="${n?Math.round(n/max*100):0}"></div></div>
      <div class="n">${n}</div></div>`;
  }).join("") + `<div class="row total"><div class="code">TOTAL</div><div class="track"></div>
    <div class="n">${total}</div></div></div>`;
}
function copyText(){
  const t = tallyOf(orders);
  const lines = [pretty(selKey()) + " 訂餐"];
  ROWS.forEach(r=>{ if(t[r.k]) lines.push(`${r.code}${r.sub?" "+r.sub:""} x${t[r.k]}`); });
  lines.push(`共 ${Object.values(t).reduce((a,b)=>a+b,0)} 份`);
  const text = lines.join("\n");
  const done = ()=>{ buzz(14); const b = $("copy");
    if(b){ b.classList.add("done"); b.textContent = "已複製 ✓";
      setTimeout(()=>{ b.classList.remove("done"); b.textContent = "複製統計"; }, 1800); } };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, ()=>prompt("手動複製：", text));
  else prompt("手動複製：", text);
}

function phaseOf(key){
  const d = dayDocs[key], shot = d && d.shot;
  if(!(shot && (shot.bento || shot.set))) return "none";
  if(key > todayKey()) return "future";
  if(key < todayKey()) return "past";
  if(d.forceOpen === true) return "open";
  if(d.forceOpen === false) return "closed";
  const n = nowMins();
  if(n < mins(settings.openTime||D.openTime)) return "early";
  if(n >= mins(settings.closeTime||D.closeTime)) return "closed";
  return "open";
}

/* ---------- render ---------- */
function render(){
  if(!settingsLoaded) return;
  if(!unlocked){ renderGate(!settings.adminPin); return; }

  if(!shellUp){
    root.innerHTML = `<header><div class="wrap">
        <div class="top"><div class="ttl">ADMIN<small id="wkLabel"></small></div>
        <button class="link" id="histBtn">歷史</button></div>
        <div class="tabs" id="tabs"></div></div><div class="scan"></div></header>
      <main><div class="wrap" id="main"></div></main>`;
    shellUp = true; sigTabs = ""; sigMain = "";
    $("histBtn").onclick = ()=>{
      if(view === "history") view = "day";
      else { view = "history"; if(!hist.orders && !hist.loading) loadHistory(hist.key); }
      sigMain = ""; render();
    };
  }
  $("wkLabel").textContent = `${md(week[0])} – ${md(week[4])}`;
  $("histBtn").classList.toggle("on", view === "history");

  const tabSig = week.map(k=>{ const s = (dayDocs[k]&&dayDocs[k].shot)||{};
    return k + (s.bento?1:0) + (s.set?1:0); }).join("|") + "#" + view + sel;
  if(tabSig !== sigTabs){
    sigTabs = tabSig;
    $("tabs").innerHTML = week.map((k,i)=>{
      const s = (dayDocs[k] && dayDocs[k].shot) || {};
      const cls = ["tab", (s.bento&&s.set)?"done":(s.bento||s.set)?"half":"",
        (view==="day"&&sel===i)?"sel":"", k===todayKey()?"today":""].filter(Boolean).join(" ");
      return `<button class="${cls}" data-tab="${i}"><div class="w">${WD[i]}</div><div class="d">${md(k)}</div></button>`;
    }).join("") +
    `<button class="tab ${view==="settings"?"sel":""}" data-tab="set"><div class="w">設定</div><div class="d">···</div></button>`;
    $("tabs").querySelectorAll("[data-tab]").forEach(b=>{
      b.onclick = ()=>{ buzz(9);
        if(b.dataset.tab === "set") view = "settings";
        else { const i = Number(b.dataset.tab);
          if(view === "day" && sel === i) return;
          sel = i; view = "day"; watchSel(); }
        sigMain = ""; render(); };
    });
  }

  const sig = view === "settings" ? "s|" + JSON.stringify(settings)
            : view === "history"  ? "h|" + hist.key + hist.loading + JSON.stringify(hist.orders)
            : "d|" + selKey() + JSON.stringify(orders) + JSON.stringify(dayDocs[selKey()]||{})
              + (photos.bento?1:0) + (photos.set?1:0) + JSON.stringify(busy)
              + phaseOf(selKey()) + settings.seatCount;
  if(sig === sigMain) return;
  sigMain = sig;

  $("main").innerHTML = view === "settings" ? settingsView()
                      : view === "history"  ? historyView() : dayView();
  bindMain();
  requestAnimationFrame(()=>{
    document.querySelectorAll(".fill").forEach(f=>{ f.style.width = (f.dataset.w||0) + "%"; });
  });
}

function dayView(){
  const key = selKey(), p = phaseOf(key), isToday = key === todayKey();
  const openT = settings.openTime||D.openTime, closeT = settings.closeTime||D.closeTime;
  const active = orders.filter(o=>o.item);
  const unpaid = active.filter(o=>!o.paid).sort((a,b)=>a.seat-b.seat);
  const paid   = active.filter(o=>o.paid).sort((a,b)=>a.seat-b.seat);
  const has = new Set(active.map(o=>o.seat));
  const missing = [];
  for(let i=1;i<=(settings.seatCount||D.seatCount);i++) if(!has.has(i)) missing.push(i);

  const state =
    p==="none"   ? `<div class="state wait"><span class="ico"></span><div class="t">還沒拍單子<small>拍完這天才會開</small></div></div>` :
    p==="future" ? `<div class="state wait"><span class="ico"></span><div class="t">已排好，等當天<small>學生當天 ${openT} 才看得到</small></div></div>` :
    p==="past"   ? `<div class="state shut"><span class="ico"></span><div class="t">這天已經過了<small>下面是當天的紀錄</small></div></div>` :
    p==="early"  ? `<div class="state wait"><span class="ico"></span><div class="t">${openT} 才開放<small>還沒到開放時間</small></div><button class="btn" id="openNow">提前開啟</button></div>` :
    p==="open"   ? `<div class="state"><span class="ico"></span><div class="t">開放中<small>${dayDocs[key]&&dayDocs[key].forceOpen===true?"手動開啟中，記得自己關":closeT+" 自動截止"}</small></div><button class="btn ghost" id="closeNow">關閉</button></div>` :
                   `<div class="state shut"><span class="ico"></span><div class="t">已關閉<small>有人漏點就按開啟</small></div><button class="btn solid" id="openNow">手動開啟</button></div>`;

  const f = dayDocs[key] && dayDocs[key].forceOpen;
  const reset = (isToday && (f===true || f===false))
    ? `<button class="btn ghost wide" id="auto">恢復自動（${openT}–${closeT}）</button>` : "";

  const slot = (kind, lbl) => `
    <label class="slot ${photos[kind]?"filled":""} ${busy[kind]?"busy":""}">
      ${photos[kind] ? `<img src="${photos[kind]}" alt=""><span class="tag">${lbl} · 點一下換</span>`
                     : `<span class="plus">＋</span><span>加${lbl}</span>`}
      <input type="file" accept="image/*" data-kind="${kind}"></label>`;

  return `
  <div class="dayttl">${pretty(key)}${isToday?`<span class="tag">TODAY</span>`:""}</div>
  <section><div class="slots">${slot("bento","便當單")}${slot("set","套餐單")}</div>${state}${reset}</section>
  <section>
    <div class="shead"><h2>TALLY</h2><span class="rule"></span><span class="cnt">${active.length} 人</span></div>
    ${tallyHTML(orders)}
    <button class="btn solid wide" id="copy">複製統計</button>
  </section>
  <section>
    <div class="shead"><h2>收錢</h2><span class="rule"></span><span class="cnt">${paid.length}/${active.length}</span></div>
    <div class="shead" style="margin:14px 0 9px"><span class="cnt" style="color:var(--rust)">還沒付 ${unpaid.length}</span><span class="rule"></span></div>
    ${unpaid.length?`<div class="people">${unpaid.map(personCard).join("")}</div>`:`<div class="empty">全部收齊了</div>`}
    <div class="shead" style="margin:18px 0 9px"><span class="cnt" style="color:var(--sage)">已付 ${paid.length}</span><span class="rule"></span></div>
    ${paid.length?`<div class="people">${paid.map(personCard).join("")}</div>`:`<div class="empty">還沒有人付</div>`}
  </section>
  <section>
    <div class="shead"><h2>沒訂餐</h2><span class="rule"></span><span class="cnt">${missing.length} 人</span></div>
    ${missing.length?`<div class="miss">${missing.map(s=>`<button data-add="${s}">${s}</button>`).join("")}</div>
      <p class="hint">點號碼可以幫他補一單。</p>`:`<div class="empty">全班都訂了</div>`}
  </section>`;
}
function personCard(o, i, arr, ro){
  return `<button class="p ${o.paid?"paid":""} ${ro?"ro":""}" style="animation-delay:${Math.min((i||0)*20,300)}ms"
    ${ro?"":`data-seat="${o.seat}"`}><div class="s">${o.seat}</div><div class="o">${label(o)}</div></button>`;
}

function settingsView(){
  return `
  <section>
    <div class="shead"><h2>TIME</h2><span class="rule"></span><span class="cnt">訂餐時間</span></div>
    <div class="setrow"><label>每天開放</label><input id="openTime" type="time" value="${settings.openTime||D.openTime}"></div>
    <div class="setrow"><label>每天截止</label><input id="closeTime" type="time" value="${settings.closeTime||D.closeTime}"></div>
    <div class="setrow"><label>班上人數</label><input id="seatCount" type="number" inputmode="numeric" min="1" max="60" value="${settings.seatCount||D.seatCount}"></div>
    <p class="hint">改完馬上生效，全班的頁面會自己更新。<br>時間一律以台灣時間為準，不管手機時區設成哪裡。</p>
  </section>
  <section>
    <div class="shead"><h2>SYSTEM</h2><span class="rule"></span></div>
    <button class="btn ghost wide" id="chpin">換管理密碼</button>
    <button class="btn ghost wide" id="logout">鎖定後台</button>
  </section>`;
}
function historyView(){
  const list = hist.orders;
  let inner;
  if(hist.loading) inner = `<div class="empty">讀取中…</div>`;
  else if(!list) inner = `<div class="empty">選一個日期查紀錄。</div>`;
  else if(!list.length) inner = `<div class="empty">${pretty(hist.key)} 沒有人訂餐。</div>`;
  else {
    const s = [...list].sort((a,b)=>a.seat-b.seat);
    const paidN = s.filter(o=>o.paid).length;
    inner = tallyHTML(s) +
      `<div class="shead" style="margin:18px 0 9px"><h2 style="font-size:11px">名單</h2>
        <span class="rule"></span><span class="cnt">${paidN}/${s.length} 已付</span></div>
       <div class="people">${s.map((o,i,a)=>personCard(o,i,a,true)).join("")}</div>`;
  }
  return `<section>
    <div class="shead"><h2>HISTORY</h2><span class="rule"></span><span class="cnt">歷史紀錄</span></div>
    <div class="setrow"><label>日期</label><input id="histDate" type="date" value="${hist.key}"></div>
    ${inner}</section>`;
}
async function loadHistory(key){
  hist = { key, orders:null, loading:true }; sigMain = ""; render();
  try{
    const snap = await db.collection("days").doc(key).collection("orders").get();
    hist = { key, loading:false, orders: snap.docs.map(d=>{ const v = d.data();
      return { seat:Number(v.seat ?? d.id), item:v.item ?? null, variant:v.variant ?? null, paid:!!v.paid }; })
      .filter(o=>o.item) };
  }catch(e){ console.error(e); hist = { key, orders:[], loading:false }; toast("讀取失敗", true); }
  sigMain = ""; render();
}

function bindMain(){
  document.querySelectorAll("input[data-kind]").forEach(inp=>{
    inp.onchange = ()=>{ if(inp.files && inp.files[0]) upload(inp.dataset.kind, inp.files[0]); inp.value = ""; };
  });
  const on = $("openNow");  if(on) on.onclick = ()=>setForce(true);
  const cn = $("closeNow"); if(cn) cn.onclick = ()=>setForce(false);
  const au = $("auto");     if(au) au.onclick = ()=>setForce(null);
  const cp = $("copy");     if(cp) cp.onclick = copyText;

  document.querySelectorAll(".p[data-seat]").forEach(el=>{
    el.onclick = ()=>{ const o = orders.find(x=>String(x.seat) === el.dataset.seat); if(o) openPerson(o); };
  });
  document.querySelectorAll("[data-add]").forEach(el=>{
    el.onclick = ()=>openPicker(Number(el.dataset.add), null);
  });

  const ot = $("openTime");  if(ot) ot.onchange = e=>saveSetting({ openTime: e.target.value || D.openTime });
  const ct = $("closeTime"); if(ct) ct.onchange = e=>saveSetting({ closeTime: e.target.value || D.closeTime });
  const sc = $("seatCount"); if(sc) sc.onchange = e=>saveSetting({ seatCount: Math.max(1, Math.min(60, Number(e.target.value)||D.seatCount)) });
  const cpn = $("chpin");
  if(cpn) cpn.onclick = ()=>{ const v = (prompt("新的 4 位數管理密碼：")||"").trim();
    if(!/^\d{4}$/.test(v)){ if(v) toast("要 4 位數字", true); return; } saveSetting({ adminPin:v }); };
  const lo = $("logout");
  if(lo) lo.onclick = ()=>{ sessionStorage.removeItem("lunch_admin"); unlocked = false; shellUp = false; render(); };
  const hd = $("histDate"); if(hd) hd.onchange = ()=>{ if(hd.value) loadHistory(hd.value); };
}
async function saveSetting(obj){
  try{ await db.collection("config").doc("settings").set(obj, { merge:true }); toast("已更新"); }
  catch(e){ console.error(e); toast("存不進去", true); }
}

/* ---------- 監聽 ---------- */
function watchWeek(){
  if(unsubWeek) unsubWeek();
  unsubWeek = db.collection("days")
    .where(firebase.firestore.FieldPath.documentId(), "in", week)
    .onSnapshot(s=>{ dayDocs = {}; s.forEach(d=>{ dayDocs[d.id] = d.data(); }); render(); }, e=>console.error(e));
}
function watchSel(){
  if(unsubOrders) unsubOrders();
  if(unsubMedia) unsubMedia();
  orders = []; photos = { bento:null, set:null };
  const ref = db.collection("days").doc(selKey());
  unsubOrders = ref.collection("orders").onSnapshot(s=>{
    orders = s.docs.map(d=>{ const v = d.data();
      return { seat:Number(v.seat ?? d.id), item:v.item ?? null, variant:v.variant ?? null, paid:!!v.paid }; });
    render();
  }, e=>console.error(e));
  unsubMedia = ref.collection("media").onSnapshot(s=>{
    photos = { bento:null, set:null };
    s.forEach(d=>{ photos[d.id] = d.data().data || null; });
    render();
  }, e=>console.error(e));
}

db.collection("config").doc("settings").onSnapshot(s=>{
  if(s.exists) settings = Object.assign({}, D, s.data());
  settingsLoaded = true; render();
}, e=>{ console.error(e); settingsLoaded = true; render(); });

if(unlocked){ watchWeek(); watchSel(); }

setInterval(()=>{
  const w = weekKeys();
  if(w.join() !== week.join()){
    week = w; const i = week.indexOf(todayKey()); sel = i>=0 ? i : 0;
    sigTabs = ""; sigMain = "";
    if(unlocked){ watchWeek(); watchSel(); }
  }
  if(unlocked) render();
}, 30000);
</script>
