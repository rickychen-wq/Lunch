<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>訂餐系統</title>
<meta name="theme-color" content="#131109">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="訂餐系統">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131109; --surface:#1E1A11; --surface-2:#272115; --line:#3A3221;
    --gold:#E8B33C; --gold-dim:#8A7440; --text:#F2ECE0; --muted:#9A9384;
    --sage:#7FA86B; --rust:#B4553F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.6;
    padding-bottom:max(36px,env(safe-area-inset-bottom));min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
         padding-top:max(12px,env(safe-area-inset-top))}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 0 12px}
  .date{font-size:20px;font-weight:700}
  .who{background:none;border:none;color:var(--muted);font-size:14px;padding:6px 0;cursor:pointer;font-family:inherit;flex:none}
  .who b{color:var(--gold);font-family:"JetBrains Mono",monospace}

  .status{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:9px;font-size:14.5px;
          background:var(--surface);border:1px solid var(--line);margin:14px 0 0}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--sage)}
  .status.wait .dot{background:var(--gold-dim)}
  .status.shut .dot{background:var(--rust)}
  .status.wait,.status.shut{color:var(--muted)}

  .shots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 26px}
  .shot{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
        background:var(--surface);aspect-ratio:3/4;cursor:zoom-in;padding:0;display:block;width:100%}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;text-align:left;
                   background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px}

  h2{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 10px;
     display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  h2 em{font-style:normal;font-size:13px;color:var(--gold-dim);flex:none}
  section{margin-bottom:28px}

  .grid{display:grid;gap:10px}
  .grid.a{grid-template-columns:repeat(4,1fr)}
  .grid.b{grid-template-columns:repeat(3,1fr)}
  .pick{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;color:var(--text);
        background:var(--surface);border:1px solid var(--line);border-radius:10px;height:62px;
        cursor:pointer;transition:transform .08s ease}
  .grid.b .pick{height:72px;font-size:24px}
  .pick:active{transform:scale(.95)}
  .pick[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#231B08}
  .pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  body.locked .pick{cursor:default}
  body.locked .pick:not([aria-pressed="true"]){opacity:.3}
  body.locked .pick:active{transform:none}

  .summary{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .summary .lbl{color:var(--muted);font-size:14px}
  .chip{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:17px;background:var(--surface-2);
        border:1px solid var(--gold-dim);color:var(--gold);padding:4px 12px;border-radius:6px}
  .summary .none{color:var(--muted);font-size:15px}

  .seatbox{padding:38px 0}
  .seatbox h1{font-size:24px;margin:0 0 6px}
  .seatbox p{color:var(--muted);margin:0 0 22px;font-size:15px}
  .seats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .seats button{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:18px;height:54px;
                background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer}
  .seats button:active{background:var(--gold);color:#231B08}

  .msg{padding:54px 4px;color:var(--muted);text-align:center}
  .msg strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px;font-weight:500}

  .light{position:fixed;inset:0;background:rgba(8,7,4,.96);z-index:50;display:none;
         align-items:center;justify-content:center;padding:12px;overflow:auto}
  .light.on{display:flex}
  .light img{max-width:100%;height:auto;border-radius:6px}
  .light .close{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;background:var(--surface);
                border:1px solid var(--line);color:var(--text);border-radius:50%;width:40px;height:40px;
                font-size:20px;cursor:pointer;line-height:1}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--gold);
         color:#231B08;font-weight:700;font-size:15px;padding:10px 20px;border-radius:999px;opacity:0;
         pointer-events:none;transition:opacity .18s,transform .18s;z-index:60}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="msg">載入中…</div></div></div>
<div class="light" id="light"><button class="close">×</button><img id="lightImg" alt=""></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAd7VtfhNW_DgwPrXaYfY_Nz_WLPoWSFvA",
  authDomain: "lunch-77823.firebaseapp.com",
  projectId: "lunch-77823",
  storageBucket: "lunch-77823.firebasestorage.app",
  messagingSenderId: "178487710705",
  appId: "1:178487710705:web:8d8f26f742e8c56e506a50",
  measurementId: "G-PM5VHQ6TTQ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const BENTO = ["A1","A2","A3","A4","A5","A6","A7","A8"];
const SETS  = ["B1","B2","B3"];
const D = { seatCount:35, openTime:"06:00", closeTime:"08:10" };

/* ---- 台灣時間 ---- */
function twNow(){ const n=new Date(); return new Date(n.getTime()+n.getTimezoneOffset()*60000+8*3600000); }
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mins(hhmm){ const [h,m]=String(hhmm).split(":").map(Number); return h*60+m; }
function nowMins(){ const t=twNow(); return t.getHours()*60+t.getMinutes(); }
function pretty(key){
  const [y,m,d]=key.split("-").map(Number);
  const w=["日","一","二","三","四","五","六"][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  return `${m}/${d} 星期${w}`;
}

/* ---- state ---- */
let dayKey = keyOf(twNow());
let seat = localStorage.getItem("lunch_seat") || "";
let settings = Object.assign({}, D);
let day = null, photos = { bento:null, set:null };
let order = { bento:null, sets:[] };
let saveTimer = null, unsubOrder = null, unsubDay = null, unsubMedia = null;

const app = document.getElementById("app");
let toastTimer;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("on"),1400); }

/* ---- 目前狀態 ---- */
function phase(){
  if(!(photos.bento || photos.set)) return "none";
  const f = day && day.forceOpen;
  if(f === true) return "open";
  if(f === false) return "closed";
  const n = nowMins();
  if(n < mins(settings.openTime||D.openTime)) return "early";
  if(n >= mins(settings.closeTime||D.closeTime)) return "closed";
  return "open";
}

/* ---- 座號 ---- */
function renderSeatPicker(){
  document.body.classList.remove("locked");
  let html = `<div class="wrap seatbox"><h1>你是幾號？</h1><p>選一次就好，下次打開會自動記得。</p><div class="seats">`;
  for(let i=1;i<=(settings.seatCount||D.seatCount);i++) html += `<button data-seat="${i}">${i}</button>`;
  app.innerHTML = html + `</div></div>`;
  app.querySelectorAll("[data-seat]").forEach(b=>{
    b.onclick = ()=>{ seat=b.dataset.seat; localStorage.setItem("lunch_seat",seat); watchOrder(); render(); };
  });
}

/* ---- 主畫面 ---- */
function render(){
  if(!seat){ renderSeatPicker(); return; }
  const p = phase();
  const canOrder = (p === "open");
  document.body.classList.toggle("locked", !canOrder);

  const head = `<header><div class="wrap"><div class="hrow">
      <div class="date">${pretty(dayKey)}</div>
      <button class="who" id="changeSeat">座號 <b>${seat}</b> · 換人</button>
    </div></div></header>`;

  if(p === "none"){
    app.innerHTML = head + `<div class="wrap"><div class="msg">
      <strong>今天沒有訂餐</strong>總務上傳單子之後這裡才會出現。</div></div>`;
    bindHeader(); return;
  }

  const openT = settings.openTime||D.openTime, closeT = settings.closeTime||D.closeTime;
  const stat =
    p === "open"  ? `<div class="status"><i class="dot"></i><div>訂餐開放中，${closeT} 截止 · 點了就存好了</div></div>` :
    p === "early" ? `<div class="status wait"><i class="dot"></i><div>${openT} 開放訂餐，先看菜單也行</div></div>` :
                    `<div class="status shut"><i class="dot"></i><div>今天訂餐已結束，明天 ${openT} 再開</div></div>`;

  const shots = `<div class="shots">
    ${photos.bento?`<button class="shot" data-zoom="bento"><img src="${photos.bento}" alt="今日便當單"><figcaption>便當單</figcaption></button>`:""}
    ${photos.set?`<button class="shot" data-zoom="set"><img src="${photos.set}" alt="今日套餐單"><figcaption>套餐單</figcaption></button>`:""}
  </div>`;

  const picked = [order.bento, ...order.sets].filter(Boolean);
  const sum = picked.length
    ? `<span class="lbl">你點了</span>` + picked.map(c=>`<span class="chip">${c}</span>`).join("")
    : `<span class="none">${canOrder?"還沒點餐 · 不吃的話不用按":"今天沒有訂"}</span>`;

  app.innerHTML = head + `<div class="wrap">
    ${stat}${shots}
    <section><h2>便當<em>選一個</em></h2>
      <div class="grid a">${BENTO.map(c=>`<button class="pick" data-a="${c}" aria-pressed="${order.bento===c}">${c}</button>`).join("")}</div></section>
    <section><h2>套餐<em>可以複選</em></h2>
      <div class="grid b">${SETS.map(c=>`<button class="pick" data-b="${c}" aria-pressed="${order.sets.includes(c)}">${c}</button>`).join("")}</div></section>
    <div class="summary">${sum}</div>
  </div>`;

  bindHeader();
  app.querySelectorAll("[data-zoom]").forEach(el=>{ el.onclick = ()=>openLight(photos[el.dataset.zoom]); });
  if(!canOrder) return;

  app.querySelectorAll("[data-a]").forEach(b=>{
    b.onclick = ()=>{ const c=b.dataset.a; order.bento = (order.bento===c)?null:c; save(); render(); };
  });
  app.querySelectorAll("[data-b]").forEach(b=>{
    b.onclick = ()=>{ const c=b.dataset.b;
      order.sets = order.sets.includes(c) ? order.sets.filter(x=>x!==c) : [...order.sets,c].sort();
      save(); render(); };
  });
}

function bindHeader(){
  const b = document.getElementById("changeSeat");
  if(b) b.onclick = ()=>{
    if(confirm("要改成別的座號嗎？")){
      localStorage.removeItem("lunch_seat"); seat="";
      if(unsubOrder){ unsubOrder(); unsubOrder=null; }
      order = { bento:null, sets:[] };
      render();
    }
  };
}

function save(){
  clearTimeout(saveTimer);
  const snapshot = { bento: order.bento, sets: [...order.sets] };
  saveTimer = setTimeout(async ()=>{
    if(phase() !== "open"){ toast("已經截止了"); return; }
    try{
      await db.collection("days").doc(dayKey).collection("orders").doc(String(seat)).set({
        seat: Number(seat), bento: snapshot.bento, sets: snapshot.sets,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true });
      toast("已儲存");
    }catch(e){ console.error(e); toast("存不進去，檢查網路"); }
  }, 300);
}

const light = document.getElementById("light");
function openLight(src){ if(!src) return; document.getElementById("lightImg").src = src; light.classList.add("on"); }
light.onclick = ()=>light.classList.remove("on");
document.addEventListener("keydown", e=>{ if(e.key==="Escape") light.classList.remove("on"); });

/* ---- 監聽 ---- */
function watchOrder(){
  if(unsubOrder) unsubOrder();
  if(!seat) return;
  unsubOrder = db.collection("days").doc(dayKey).collection("orders").doc(String(seat))
    .onSnapshot(s=>{ const d=s.data();
      order = { bento: d?.bento ?? null, sets: Array.isArray(d?.sets)?d.sets:[] };
      render(); }, e=>console.error(e));
}
function watchDay(){
  if(unsubDay) unsubDay();
  if(unsubMedia) unsubMedia();
  const ref = db.collection("days").doc(dayKey);
  unsubDay = ref.onSnapshot(s=>{ day = s.exists?s.data():null; render(); }, e=>console.error(e));
  unsubMedia = ref.collection("media").onSnapshot(snap=>{
    photos = { bento:null, set:null };
    snap.forEach(d=>{ photos[d.id] = d.data().data || null; });
    render();
  }, e=>console.error(e));
}

db.collection("config").doc("settings").onSnapshot(s=>{
  if(s.exists) settings = Object.assign({}, D, s.data());
  render();
}, e=>console.error(e));

watchDay();
if(seat) watchOrder();

/* 每分鐘檢查：時間到自動鎖，跨日自動換今天 */
setInterval(()=>{
  const k = keyOf(twNow());
  if(k !== dayKey){
    dayKey = k; day = null; photos = { bento:null, set:null }; order = { bento:null, sets:[] };
    watchDay(); if(seat) watchOrder();
  }
  render();
}, 30000);
</script>
</body>
</html>
